name: K50 signed device test build

on:
  workflow_dispatch:
    inputs:
      version_name:
        required: true
        type: string
        default: 2.3.6
      version_code:
        required: true
        type: string
        default: '1790000108'
      release_channel:
        required: true
        type: string
        default: beta

permissions:
  contents: read

env:
  JAVA_TOOL_OPTIONS: --enable-native-access=ALL-UNNAMED

jobs:
  device-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android toolchain
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;30.0.16248370' 'cmake;4.1.2'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare existing signing identity
        env:
          SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
          SIGN_KEYSTORE_PASSWORD: ${{ secrets.SIGN_KEYSTORE_PASSWORD }}
          SIGN_ALIAS: ${{ secrets.SIGN_ALIAS }}
          SIGN_KEY_PASSWORD: ${{ secrets.SIGN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in SIGN_KEYSTORE_BASE64 SIGN_KEYSTORE_PASSWORD SIGN_ALIAS SIGN_KEY_PASSWORD; do
            test -n "${!name:-}" || { echo "Missing signing secret: $name"; exit 1; }
          done
          umask 077
          printf '%s' "$SIGN_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/portal-device.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/portal-device.jks" >> "$GITHUB_ENV"
      - name: Build signed debug app and instrumentation for device regression
        env:
          KEYSTORE_PASSWORD: ${{ secrets.SIGN_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGN_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGN_KEY_PASSWORD }}
          AMAP_ANDROID_KEY: ${{ secrets.AMAP_ANDROID_KEY }}
          TENCENT_MAP_KEY: ${{ secrets.TENCENT_MAP_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleArm64Debug :app:assembleArm64DebugAndroidTest :xposed:assembleDebugAndroidTest -PAPP_VERSION_NAME="${{ inputs.version_name }}" -PAPP_VERSION_CODE="${{ inputs.version_code }}" -PBUILD_REVISION="$GITHUB_SHA" --max-workers=2 --build-cache --stacktrace
          python3 scripts/check_xposed_module.py --apk-dir app/build/outputs/apk/arm64/debug
      - name: Upload device-only test APKs
        uses: actions/upload-artifact@v4
        with:
          name: K50-device-test-${{ github.sha }}
          path: |
            app/build/outputs/apk/arm64/debug/*.apk
            app/build/outputs/apk/androidTest/arm64/debug/*.apk
            xposed/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: rm -f -- "$RUNNER_TEMP/portal-device.jks"
