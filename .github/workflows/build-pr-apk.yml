name: Pull Request Verification

"on":
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  JAVA_TOOL_OPTIONS: --enable-native-access=ALL-UNNAMED

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
      - name: Install Android toolchain
        run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.31.6'
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, lint and release APKs
        run: |
          chmod +x ./gradlew
          ./gradlew :core:test :app:testArm64DebugUnitTest :xposed:testDebugUnitTest lint :app:assembleRelease :app:exportReleaseApks -PBUILD_REVISION="$GITHUB_SHA" --build-cache --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: LocationService-${{ github.sha }}
          path: app/build/outputs/distribution/*.apk
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.sha }}
          path: |
            core/build/reports/tests/
            app/build/reports/
            xposed/build/reports/
            system-api/build/reports/
