name: Print Keystore Fingerprint (temporary)

on:
  workflow_dispatch:

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    steps:
      - name: Decode keystore and print certificate fingerprints
        env:
          SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
          SIGN_KEYSTORE_PASSWORD: ${{ secrets.SIGN_KEYSTORE_PASSWORD }}
          SIGN_ALIAS: ${{ secrets.SIGN_ALIAS }}
          SIGN_KEY_PASSWORD: ${{ secrets.SIGN_KEY_PASSWORD }}
        run: |
          echo "$SIGN_KEYSTORE_BASE64" | base64 -d > /tmp/keystore.jks
          echo "=== SHA1/MD5 fingerprints (safe to print) ==="
          keytool -list -v -keystore /tmp/keystore.jks -storepass "$SIGN_KEYSTORE_PASSWORD" \
            | grep -E "SHA1:|SHA-1|MD5:|别名|Alias|Valid" || true
          rm -f /tmp/keystore.jks
