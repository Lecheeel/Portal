<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">Rick and Morty Portal Gun — Neon Chamber</title>
  <desc id="desc">参考动画截图的传送枪，保留原版视角，浅薄荷绿顶面、蓝灰色枪身、红色按钮、荧光绿旋涡能量舱。透明背景，无地面投影。</desc>
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2=".15">
      <stop stop-color="#d8ffd0" stop-opacity=".62"/>
      <stop offset=".55" stop-color="#dbffd4" stop-opacity=".36"/>
      <stop offset="1" stop-color="#edffe4" stop-opacity=".29"/>
    </linearGradient>
    <radialGradient id="core" cx=".38" cy=".3" r=".8">
      <stop stop-color="#a1ed72"/>
      <stop offset=".48" stop-color="#77d54d"/>
      <stop offset="1" stop-color="#42b727"/>
    </radialGradient>
    <linearGradient id="port" x1="0" y1="0" x2="1" y2=".3">
      <stop stop-color="#8fff5d"/>
      <stop offset=".55" stop-color="#4edc23"/>
      <stop offset="1" stop-color="#25b818"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#c2c6bb"/>
      <stop offset="1" stop-color="#92968d"/>
    </linearGradient>
    <linearGradient id="neonChamber" x1="0" y1="0" x2="1" y2=".15">
      <stop stop-color="#85f52e"/>
      <stop offset=".32" stop-color="#a2ff3c"/>
      <stop offset=".72" stop-color="#7fed27"/>
      <stop offset="1" stop-color="#b9ff51"/>
    </linearGradient>
    <clipPath id="chamberClip">
      <path d="M795 495V314 C794 254 827 218 878 218 C936 217 965 252 966 311V495 Q885 527 795 495Z"/>
    </clipPath>
    <filter id="energyGlow" x="-.3" y="-.3" width="1.6" height="1.6" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <g stroke="#203a2b" stroke-linejoin="round" stroke-linecap="round">
    <!-- Rear switch and grip sit behind the main casing. -->
    <path d="M492 533 Q529 495 571 485 L587 508 522 548Z" fill="#606161" stroke-width="6"/>
    <path d="M511 522 560 497 568 508Z" fill="#989a98" stroke="none"/>
    <path d="M479 585 C447 624 400 695 365 767 C342 810 356 848 386 864 C419 882 459 863 474 827 L538 643Z" fill="#49676a" stroke-width="7"/>
    <path d="M477 604 C444 651 398 719 374 775 C357 811 369 841 393 852 C418 864 449 848 463 819 L518 644Z" fill="#8aa6a1" stroke="none"/>
    <path d="M466 619 C430 667 392 730 375 770 C363 800 367 823 379 837 C357 821 362 791 373 766 C394 719 433 651 463 614Z" fill="#b6cbbd" stroke="none"/>
    <path d="m517 644-9 24 8-4-11 23-8 4-6 27m23-59 9-8-6 21m-6-4-10 8-3 12" fill="none" stroke="#646662" stroke-width="1.2"/>
    <!-- Top plane, front bevel, and broad side plane. -->
    <path d="M494 532 674 480 1167 529 1035 589Z" fill="#c0e7c0" stroke-width="5"/>
    <path d="M494 532 1035 589 1015 707 520 646 C486 643 470 621 473 580 Q475 547 494 532Z" fill="#557e80" stroke-width="5"/>
    <path d="M1035 589 1167 529 1146 644 1015 707Z" fill="#71938c" stroke-width="5"/>
    <path d="m1041 599 113-53-17 91-112 56Z" fill="#284b3c" stroke-width="4"/>
    <path d="m1048 601 98-47-14 77-99 50Z" fill="#466f51" stroke-width="3"/>
    <path d="m1035 676 96-48m-85-24 96-46" fill="none" stroke="#c4c5be" stroke-width="3"/>
    <path d="m1017 581 69-28m-69-19 34-14m-19 23 43-21" fill="none" stroke-width="3"/>
    <!-- Recessed red control on the upper face. -->
    <path d="m583 529 116-39 75 7-118 40Z" fill="#627b53" stroke-width="2"/>
    <path d="m605 531 94-31 56 5-99 32Z" fill="#b8492e" stroke-width="2"/>
    <path d="m699 491 0 9 56 5 19-8Z" fill="#d9e9bc" stroke-width="1.6"/>
    <path d="m605 531 94-31v-9l-116 38Z" fill="#8ca576" stroke-width="1.5"/>
    <!-- Three inset emitter sockets, foreshortened on the end face. -->
    <g transform="rotate(13 1046 632)">
      <ellipse cx="1046" cy="632" rx="14" ry="35" fill="#568551" stroke-width="3"/>
      <ellipse cx="1046" cy="632" rx="9" ry="24" fill="url(#port)" stroke-width="2"/>
      <path d="M1042 617q-4 10-3 20" fill="none" stroke="#bdff8c" stroke-width="2"/>
    </g>
    <g transform="rotate(13 1085 613)">
      <ellipse cx="1085" cy="613" rx="17" ry="35" fill="#568551" stroke-width="3"/>
      <ellipse cx="1085" cy="613" rx="11" ry="25" fill="url(#port)" stroke-width="2"/>
      <path d="M1081 595q-5 11-4 22" fill="none" stroke="#bdff8c" stroke-width="2"/>
    </g>
    <g transform="rotate(13 1125 594)">
      <ellipse cx="1125" cy="594" rx="17" ry="35" fill="#568551" stroke-width="3"/>
      <ellipse cx="1125" cy="594" rx="11" ry="25" fill="url(#port)" stroke-width="2"/>
      <path d="M1122 578q-5 10-4 20" fill="none" stroke="#bdff8c" stroke-width="2"/>
    </g>
    <!-- A luminous filled chamber, following the original silhouette and viewpoint. -->
    <ellipse cx="896" cy="542" rx="98" ry="13" fill="#3b6655" stroke="none" opacity=".25"/>
    <path d="M795 495V314 C794 254 827 218 878 218 C936 217 965 252 966 311V495 Q885 527 795 495Z" fill="url(#neonChamber)" stroke="#a5f569" stroke-width="4"/>
    <g clip-path="url(#chamberClip)" fill="none">
      <g stroke="#d9ff78" stroke-width="13" opacity=".65" filter="url(#energyGlow)">
        <path d="M800 276 C837 245 876 274 853 302 S815 340 842 361 S888 366 891 337 S866 305 854 327 S849 379 885 383 S935 360 926 340 S919 310 947 296 S960 261 936 244"/>
        <path d="M797 433 C817 406 848 418 843 442 S819 479 837 500 M889 518 C871 488 913 485 902 459 S871 427 896 407 S932 410 930 433 S947 459 971 439"/>
      </g>
      <g stroke="#d0ff71" stroke-width="6" opacity=".9">
        <path d="M800 276 C837 245 876 274 853 302 S815 340 842 361 S888 366 891 337 S866 305 854 327 S849 379 885 383 S935 360 926 340 S919 310 947 296 S960 261 936 244"/>
        <path d="M797 433 C817 406 848 418 843 442 S819 479 837 500 M889 518 C871 488 913 485 902 459 S871 427 896 407 S932 410 930 433 S947 459 971 439"/>
        <path d="M876 221 C889 241 914 239 906 263 S883 288 902 304 M794 388 C815 378 830 388 822 407 M950 471 C934 481 948 501 934 513"/>
      </g>
      <path d="M819 306 C818 267 839 242 862 236" stroke="#eeffb0" stroke-width="9" opacity=".65"/>
      <path d="M809 325 804 407 M957 344 954 397" stroke="#cfff83" stroke-width="4" opacity=".5"/>
    </g>
    <path d="M795 495V314 C794 254 827 218 878 218 C936 217 965 252 966 311V495 Q885 527 795 495Z" fill="none" stroke="#aafa71" stroke-width="3"/>
    <!-- Thick metal collar hides the bottom rim of the glass. -->
    <path d="M794 494 C805 514 946 518 967 494 C975 505 979 519 976 531 C973 557 795 554 786 536 C779 524 784 507 790 500" fill="#c7f5bd" stroke-width="3"/>
    <path d="M804 538q69 20 151 3" fill="none" stroke-width="2"/>
    <path d="m817 540 10 3" fill="none" stroke="#567a58" stroke-width="1.3"/>
  </g>
</svg>
