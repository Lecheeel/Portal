    <path d="M511 522 560 497 568 508Z" fill="#989a98" stroke="none"/>
    <path d="M479 585 C447 624 400 695 365 767 C342 810 356 848 386 864 C419 882 459 863 474 827 L538 643Z" fill="#777977" stroke-width="7"/>
