    <path d="M884 456q-8 12 1 20t0 17q-5 6-2 12" fill="none" stroke="#90d567" stroke-width="1.1"/>
    <path d="M865 478q10 0 4 7t2 10" fill="none" stroke="#718365" stroke-width="1.4"/>
