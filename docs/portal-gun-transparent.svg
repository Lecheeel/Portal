    <g fill="none" stroke="#3c6a2e" stroke-width="1.7">
      <path d="M1081 619c16 1 24 11 38 8s21 1 29 12 10 8 16 8m-84-19c14 3 24 0 34 9m-24 7q15 1 25 17"/>
