<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">Rick and Morty Portal Gun</title>
  <desc id="desc">手绘风格传送枪：灰色金属枪身、三枚绿色发射孔、装有绿色能量团的透明玻璃罩，透明背景。</desc>
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2=".15">
      <stop stop-color="#d8ffd0" stop-opacity=".62"/>
      <stop offset=".55" stop-color="#dbffd4" stop-opacity=".36"/>
      <stop offset="1" stop-color="#edffe4" stop-opacity=".29"/>
    </linearGradient>
    <radialGradient id="core" cx=".38" cy=".3" r=".8">
      <stop stop-color="#a1ed72"/>
      <stop offset=".48" stop-color="#77d54d"/>
      <stop offset="1" stop-color="#42b727"/>
    </radialGradient>
    <linearGradient id="port" x1="0" y1="0" x2="1" y2=".3">
      <stop stop-color="#8fff5d"/>
      <stop offset=".55" stop-color="#4edc23"/>
      <stop offset="1" stop-color="#25b818"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#c2c6bb"/>
      <stop offset="1" stop-color="#92968d"/>
    </linearGradient>
  </defs>
